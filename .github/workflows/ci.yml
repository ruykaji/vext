name: CI

on:
  push:
  pull_request:

jobs:
  cpu:
    name: CPU / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libgtest-dev
      
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      
      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DVEXT_ENABLE_CUDA=OFF
          -DVEXT_BUILD_TESTS=ON
          -DVEXT_WARNINGS_AS_ERRORS=ON
      
      - name: Build all targets
        run: cmake --build build/ci --target all
      
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

  sanitizers:
    name: CPU / sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libgtest-dev
      
      - name: Configure
        run: >-
          cmake -S . -B build/sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DVEXT_ENABLE_CUDA=OFF
          -DVEXT_BUILD_TESTS=ON
          -DVEXT_ENABLE_SANITIZERS=ON
      
      - name: Build
        run: cmake --build build/sanitizers --target all
      
      - name: Test
        run: ctest --test-dir build/sanitizers --output-on-failure

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      
      - name: Check formatting
        run: git ls-files '*.hpp' '*.cuh' '*.cpp' '*.cu' | xargs clang-format --dry-run --Werror

  cuda-compile:
    name: CUDA / compile
    runs-on: ubuntu-latest
    container: nvidia/cuda:13.0.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: apt-get update && apt-get install -y cmake ninja-build libgtest-dev
      
      - name: Configure
        run: >-
          cmake -S . -B build/cuda -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVEXT_ENABLE_CUDA=ON
          -DVEXT_CUDA_ARCHITECTURES=86
          -DVEXT_BUILD_TESTS=ON
      
      - name: Compile all targets
        run: cmake --build build/cuda --target all

  package:
    name: Installed CPU consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      
      - name: Install vext
        run: |
          cmake -S . -B build/package -G Ninja -DVEXT_ENABLE_CUDA=OFF -DVEXT_BUILD_TESTS=OFF
          cmake --build build/package --target install -- -j2
        env:
          DESTDIR: ${{ github.workspace }}/stage
      
      - name: Configure consumer
        run: >-
          cmake -S test/package -B build/consumer -G Ninja
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/stage/usr/local
          -DVEXT_CONSUMER_BACKEND=cpu
      
      - name: Build and run consumer
        run: cmake --build build/consumer && build/consumer/vext_consumer
